name: Disaster Healthcare AI CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-test:
    name: Backend Lint, Pipeline & Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest httpx
          pip install -r requirements.txt
          pip install -r requirements-api.txt

      - name: Lint Codebase with Ruff
        run: |
          ruff check src/ tests/ api/ tests_api/ app.py

      - name: Execute Pipeline Verification
        run: |
          python run_all.py

      - name: Run Core Pytest Suite (25 Tests)
        run: |
          pytest tests/test_core.py -v

      - name: Run API & Auth/Audit Pytest Suite (23 Tests)
        run: |
          pytest tests_api/ -v

  frontend-test:
    name: Frontend Vitest & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci || npm install

      - name: Run Vitest Suite
        working-directory: ./frontend
        run: |
          npm test

      - name: Run Production Bundle Build
        working-directory: ./frontend
        run: |
          npm run build

  docker-build:
    name: Container Image Build Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: |
          docker build -f deploy/Dockerfile.api -t disaster-ai-api:ci .

      - name: Build Frontend Docker Image
        run: |
          docker build -f deploy/Dockerfile.frontend -t disaster-ai-frontend:ci .
